# Inference Parameters

# Data directory (relative path to toml file location, or absolute path)
frames_path = "./frames.jld2"
camera_params_path = "./exp_camera_params.toml"

# Inference parameters
[inference]
n_iters = 512000
size_limit = 4001
parametric = true # if true, number of tracks will remain the same as initial guess
max_n_tracks = 5 # unused if parametric = true
batchsizes = [15] #4 bit data

# Prior parameters
[priors]
msd_prior = [2, 1e-5]                      # [shape, rate] for gamma prior
diffusion_coeff_guess = 0.1
brightness_prior = [1, 1]                   # [shape, rate] for gamma prior
brightness_guess = 6.4e3
brightness_proposal = [10, 1]               # proposal params for brightness
track_prior_scale = 10                      # pixel_size * this for track position prior
track_logonprob = -10
tracks_guess_path = "./guess.jld2" # path to .jld2 file with initial track guesses

[saving]
chain_output_dir = "."
save_name = "beads"
also_save = [] # list additional files from sim dir (data_dir + simulation_i) to save in chain_output_dir, in addition to the chain files
save_unique = false # if true, will save results in folder "$(date)_inf_$(save_name)$(id)" with a unique
# id at the end if needed to avoid overwriting any results. If false, will save in directory with just "inf_$(save_name)".# 
