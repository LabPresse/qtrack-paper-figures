# Optical parameters
[camera]
numerical_aperture = 1.45
refractive_index = 1.52
wavelength = 0.571
pixel_size = 0.1 # μm
period = 10e-6  # seconds
darkcounts = 0.0  # scalar for same value for all pixels, or path to .jld2 file
detector_size = 50 # pixels

# Simulation parameters
[simulation]
n_frames = 65536
diffusion_coefficient = 10.0  # μm²/s
n_particles = 1 #originally ntracks
# brightness_multiplier = 1e4
brightness_multiplier = 1e9
detector_type = "emccd" # "spad" or "emccd"
random_seed = 17  # false to disable seeding
init_width = 10 # pix, width of uniform distribution for initial track positions
throw_out_of_bounds = false # whether to throw error if tracks are out of bounds after shifting to initial positions. If false, tracks will be shifted back into bounds.
shift=true

# Execution parameters
[saving]
save_location = "."
save_unique = false # if true, will save results in folder "$(date)_sim_$(save_name)$(id)" with a unique
# id at the end if needed to avoid overwriting any results. If false, will save in directory with just "sim_$(save_name)".
save_name = "Fig_S3_motion_blur"